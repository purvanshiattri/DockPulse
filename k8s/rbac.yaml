apiVersion: v1
kind: ServiceAccount
metadata:
  name: dockpulse-sa
  namespace: default
  labels:
    app: dockpulse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dockpulse-role
  labels:
    app: dockpulse
rules:
- apiGroups: [""]
  resources: ["pods", "pods/status", "pods/log", "services", "nodes", "namespaces"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/status", "deployments/scale"]
  verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dockpulse-role-binding
  labels:
    app: dockpulse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dockpulse-role
subjects:
- kind: ServiceAccount
  name: dockpulse-sa
  namespace: default
