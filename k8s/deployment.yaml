apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockpulse-deployment
  labels:
    app: dockpulse
    tier: frontend
spec:
  # Maintain high availability with 2 replicas
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dockpulse
  template:
    metadata:
      labels:
        app: dockpulse
    spec:
      containers:
      - name: dashboard-app
        image: dockpulse:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http-port
        
        # Inject production configs
        env:
        - name: FLASK_ENV
          value: "production"
        
        # Production Resource allocation (standard interview discussion topic)
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
            
        # Verify application status automatically (Self-healing concept)
        livenessProbe:
          httpGet:
            path: /api/system-metrics
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
          
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 2
