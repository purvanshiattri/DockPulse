version: '3.8'

services:
  # DockPulse Main Monitoring Dashboard Service
  dockpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dockpulse-dashboard
    
    # --------------------------------------------------------------------------
    # CONTAINER NETWORKING BASIC PRINCIPLE:
    # Maps port 5000 on the host machine to port 5000 inside the container namespace.
    # This allows users to browse to http://localhost:5000 on the host to hit the Flask app.
    # --------------------------------------------------------------------------
    ports:
      - "5000:5000"
    
    
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ./kubeconfig-docker:/root/.kube/config:ro
      
    environment:
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
      - KUBECONFIG=/root/.kube/config
    command: python app.py
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/runtime', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

      
    # Resource quotas to simulate production cloud constraints
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
          
    restart: unless-stopped

  # cAdvisor (Container Advisor) to monitor container resource usage and performance
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: dockpulse-cadvisor
    ports:
      - "8089:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped

  # Prometheus metrics collection and storage engine
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: dockpulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - dockpulse
      - cadvisor
    restart: unless-stopped


  # Grafana visualization dashboard
  grafana:
    image: grafana/grafana:11.2.0
    container_name: dockpulse-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:



